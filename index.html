'use strict';const $=id=>document.getElementById(id),audio=$('audio');let db,songs=[],lists=[],listId,current=null,url,ctx,source,musicGain,clickGain,timer,scheduled=[],cursor=0,anchor=null,queueIndex=-1,taps=[],loadToken=0;const status=t=>$('status').textContent=t;const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();function req(r){return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function store(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}async function put(name,v){const tx=db.transaction(name,'readwrite');tx.objectStore(name).put(v);await new Promise((ok,no)=>{tx.oncomplete=ok;tx.onerror=()=>no(tx.error);tx.onabort=()=>no(tx.error)})}async function del(name,id){await req(store(name,'readwrite').delete(id))}function list(){return lists.find(l=>l.id===listId)}function button(text,fn){const b=document.createElement('button');b.textContent=text;b.onclick=async()=>{try{await fn()}catch(e){status(e.message)}};return b}function item(parent,name,buttons){const d=document.createElement('div');d.className='item';const t=document.createElement('strong');t.textContent=name;d.append(t);const r=document.createElement('div');r.className='row';r.append(...buttons);d.append(r);parent.append(d)}function render(){const sel=$('lists');sel.replaceChildren();for(const l of lists){const o=document.createElement('option');o.value=l.id;o.textContent=l.name;sel.append(o)}sel.value=listId;$('library').replaceChildren();for(const s of songs)item($('library'),s.name+' · '+(s.bpm?s.bpm.toFixed(1)+' BPM':'Not analyzed'),[button('Play',()=>{queueIndex=-1;return load(s.id,true)}),button('Add to setlist',async()=>{const l=list();if(!l)return;l.ids.push(s.id);await put('lists',l);render()}),button('Analyze again',()=>reanalyze(s)),button('Remove',async()=>{if(!confirm('Remove '+s.name+'?'))return;if(current?.id===s.id){audio.pause();current=null;audio.removeAttribute('src');audio.load();$('title').textContent='Select a song'}await del('songs',s.id);songs=songs.filter(x=>x.id!==s.id);for(const l of lists){l.ids=l.ids.filter(id=>id!==s.id);await put('lists',l)}render()})]);$('queue').replaceChildren();(list()?.ids||[]).forEach((id,i)=>{const s=songs.find(x=>x.id===id);if(!s)return;item($('queue'),(i+1)+'. '+s.name,[button('Play',()=>playAt(i)),button('↑',()=>move(i,-1)),button('↓',()=>move(i,1)),button('Remove',async()=>{const l=list();l.ids.splice(i,1);await put('lists',l);render()})])})}async function move(i,d){const l=list(),j=i+d;if(j<0||j>=l.ids.length)return;[l.ids[i],l.ids[j]]=[l.ids[j],l.ids[i]];await put('lists',l);render()}async function init(){db=await new Promise((ok,no)=>{const r=indexedDB.open('DrumSync03',1);r.onupgradeneeded=()=>{r.result.createObjectStore('songs',{keyPath:'id'});r.result.createObjectStore('lists',{keyPath:'id'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});songs=await req(store('songs').getAll());lists=await req(store('lists').getAll());if(!lists.length){const l={id:uid(),name:'My setlist',ids:[]};await put('lists',l);lists.push(l)}listId=lists[0].id;render();status('Ready. Import one or more songs.')}async function engine(){if(!ctx){ctx=new AudioContext();source=ctx.createMediaElementSource(audio);musicGain=ctx.createGain();clickGain=ctx.createGain();source.connect(musicGain).connect(ctx.destination);clickGain.connect(ctx.destination);volumes()}await ctx.resume()}function volumes(){if(ctx){musicGain.gain.value=+$('music').value/100;clickGain.gain.value=+$('volume').value/100*.18}$('mv').textContent=$('music').value+'%';$('cv').textContent=$('volume').value+'%'}$('music').oninput=$('volume').oninput=volumes;
// Full-track onset envelope, global autocorrelation and locally adapted beat grid.
async function analyze(blob){
 const decoder=new AudioContext({sampleRate:22050});let a;try{a=await decoder.decodeAudioData(await blob.arrayBuffer())}finally{await decoder.close()}
 const hop=Math.round(a.sampleRate*.01),dt=hop/a.sampleRate,n=Math.floor(a.length/hop),bands=Array.from({length:3},()=>new Float32Array(n)),channels=Array.from({length:a.numberOfChannels},(_,i)=>a.getChannelData(i));
 let low=0,mid=0,old=[0,0,0];const rate=a.sampleRate/2,k1=1-Math.exp(-2*Math.PI*150/rate),k2=1-Math.exp(-2*Math.PI*1800/rate);
 for(let i=0;i<n;i++){let e=[0,0,0];for(let j=0;j<hop;j+=2){let v=0;for(const c of channels)v+=c[i*hop+j]/channels.length;low+=k1*(v-low);mid+=k2*(v-mid);e[0]+=low*low;e[1]+=(mid-low)**2;e[2]+=(v-mid)**2}for(let k=0;k<3;k++){let x=Math.log1p(e[k]*40);bands[k][i]=Math.max(0,x-old[k]);old[k]=x}}
 if(n<300)throw Error('Audio too short');let env=new Float32Array(n);for(let k=0;k<3;k++){let rms=Math.sqrt(bands[k].reduce((s,x)=>s+x*x,0)/n)||1;for(let i=0;i<n;i++)env[i]+=[.48,.34,.18][k]*Math.min(5,bands[k][i]/rms)}
 const corr=l=>{l=Math.round(l);let ab=0,aa=0,bb=0;for(let i=l;i<n;i++){let x=env[i],y=env[i-l];ab+=x*y;aa+=x*x;bb+=y*y}return ab/Math.sqrt(aa*bb||1)};
 let candidates=[];for(let l=25;l<=150;l++){let bpm=60/(l*dt),score=corr(l)+.45*corr(2*l)+.22*corr(3*l)+.15*corr(l/2)-.12*Math.abs(Math.log2(bpm/105));candidates.push({l,score})}candidates.sort((a,b)=>b.score-a.score);let lag=candidates[0].l,best=candidates[0].score;if(best<.12)throw Error('No reliable beat estimate');
 // Refine the period with a parabolic interpolation of the correlation peak.
 let c0=corr(lag-1),c1=corr(lag),c2=corr(lag+1),den=c0-2*c1+c2;let period=lag+(den<0?Math.max(-.5,Math.min(.5,.5*(c0-c2)/den)):0);
 const strength=i=> (env[i]||0)+.65*((env[i-1]||0)+(env[i+1]||0))+.25*((env[i-2]||0)+(env[i+2]||0));
 // Dynamic programming selects a globally coherent sequence of beat onsets.
 const dp=new Float32Array(n),prev=new Int32Array(n);prev.fill(-1);let min=Math.round(period*.72),max=Math.round(period*1.28),end=0,top=-Infinity;
 for(let i=0;i<n;i++){let v=0,p=-1;for(let d=min;d<=max&&d<=i;d++){let q=dp[i-d]-12*Math.log(d/period)**2;if(q>v){v=q;p=i-d}}dp[i]=v+Math.min(4,strength(i)*.45)-.12;prev[i]=p;if(i>=n-max&&dp[i]>top){top=dp[i];end=i}}
 let beats=[];for(let i=end;i>=0;i=prev[i])beats.push(i*dt);beats.reverse();if(beats.length<4)throw Error('Too few reliable beats');let intervals=beats.slice(1).map((x,i)=>x-beats[i]).sort((a,b)=>a-b);let bpm=60/intervals[Math.floor(intervals.length/2)];return {bpm,offset:beats[0],beats,confidence:best,duration:a.duration,analysisVersion:4,error:null};
}
async function reanalyze(s){status('Analyzing '+s.name+'…');await new Promise(r=>setTimeout(r,50));try{Object.assign(s,await analyze(s.blob));s.mode='map';s.shift=0;await put('songs',s);if(current?.id===s.id)apply(s);render();status('Analyzed '+s.name+'. Verify the beat by ear.')}catch(e){status('Analysis failed: '+e.message+'; use manual BPM.')}}$('files').onchange=async()=>{const files=[...$('files').files];$('files').disabled=true;try{for(const f of files){const s={id:uid(),name:f.name.replace(/\.[^.]+$/,''),blob:f,bpm:120,offset:0,beats:[],mode:'grid',shift:0,accent:false};status('Analyzing '+s.name+'…');await new Promise(r=>setTimeout(r,50));try{Object.assign(s,await analyze(f));s.mode='map'}catch(e){s.error=e.message}await put('songs',s);songs.push(s);render();status(s.error?'Saved; analysis failed: '+s.error:'Saved '+s.name)}}catch(e){status('Import failed: '+e.message)}finally{$('files').disabled=false;$('files').value=''}};
function apply(s){$('title').textContent=s.name;$('info').textContent=s.error?'Manual tempo · '+s.error:'Estimated '+s.bpm.toFixed(1)+' BPM · '+(s.analysisVersion===4?(s.confidence>.65?'strong':'uncertain')+' rhythm evidence':'older analysis — analyze again')+' · verify by ear';$('bpm').value=s.bpm.toFixed(2);$('offset').value=(s.offset+(s.shift||0)).toFixed(3);$('mode').value=s.mode||'grid';$('accent').checked=!!s.accent;$('music').value=s.music??80;$('volume').value=s.volume??40;volumes();reset()}async function load(id,play){const s=songs.find(x=>x.id===id);if(!s)return;const token=++loadToken;audio.pause();reset();current=s;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(s.blob);audio.src=url;apply(s);if(play){await engine();if(token===loadToken)await audio.play()}}function reset(){for(const o of scheduled){try{o.stop()}catch{}}scheduled=[];anchor=null;cursor=0}function grid(){return $('mode').value==='grid'||!current?.beats?.length}function period(){return 60/Math.max(30,Math.min(300,+$('bpm').value||120))}function shift(){return (+$('offset').value||0)-(current?.offset||0)}function beatTime(i){return grid()?(+$('offset').value||0)+i*period():current.beats[i]+shift()}function seekIndex(t){if(grid())return Math.max(0,Math.ceil((t-(+$('offset').value||0))/period()));let lo=0,hi=current.beats.length;while(lo<hi){let m=(lo+hi)>>1;if(beatTime(m)<t)lo=m+1;else hi=m}return lo}function tick(){if(!ctx||!current||audio.paused||audio.seeking||!$('click').checked||ctx.state!=='running'){if(anchor)reset();return}const now=ctx.currentTime,t=audio.currentTime;if(!anchor||Math.abs(t-(anchor.t+now-anchor.c))>.075){reset();anchor={t,c:now};cursor=seekIndex(t-.015)}const predicted=anchor.t+now-anchor.c;while(cursor<1000000){const b=beatTime(cursor);if(!Number.isFinite(b)||b>predicted+.10||b>audio.duration)break;const i=cursor++;if(b<predicted-.035)continue;const when=Math.max(now+.002,anchor.c+b-anchor.t),o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=$('acc nt.music=+$('music').value;current.volume=+$('volume').value;try{await put('songs',current);render();status('Song settings saved.')}catch(e){status(e.message)}};
async function playAt(i){const l=list();if(!l||i<0||i>=l.ids.length)return;queueIndex=i;try{await load(l.ids[i],true)}catch(e){status('Playback: '+e.message)}}$('startList').onclick=()=>playAt(0);$('prev').onclick=()=>playAt(queueIndex-1);$('next').onclick=()=>playAt(queueIndex+1);audio.onended=()=>{reset();if($('auto').checked&&queueIndex>=0)playAt(queueIndex+1)};$('lists').onchange=()=>{listId=$('lists').value;queueIndex=-1;render()};$('new').onclick=async()=>{const name=prompt('Setlist name');if(!name?.trim())return;const l={id:uid(),name:name.trim(),ids:[]};await put('lists',l);lists.push(l);listId=l.id;queueIndex=-1;render()};$('rename').onclick=async()=>{const l=list();if(!l)return;const name=prompt('Setlist name',l.name);if(name?.trim()){l.name=name.trim();await put('lists',l);render()}};$('deleteList').onclick=async()=>{const l=list();if(!l||!confirm('Delete this setlist? Songs stay in library.'))return;await del('lists',l.id);lists=lists.filter(x=>x!==l);if(!lists.length){const v={id:uid(),name:'My setlist',ids:[]};await put('lists',v);lists.push(v)}listId=lists[0].id;queueIndex=-1;render()};init().catch(e=>status('Storage unavailable: '+e.message));
